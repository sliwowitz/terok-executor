roster_version: 3

kind: native
label: Mistral Vibe
binary: vibe

wrapper:
  launcher:
    script: vibe-provider
    mode: on_provider_select

git_identity:
  name: Mistral Vibe
  email: vibe@mistral.ai

headless:
  prompt_flag: "--prompt"
  model_flag: "--agent"
  max_turns_flag: "--max-turns"

auto_approve:
  env:
    # Real Vibe field name (pydantic-settings env_prefix="VIBE_",
    # case_sensitive=False; vibe.core.config._settings.VibeConfig has
    # ``bypass_tool_permissions: bool = False``).  ACP gates the
    # approval callback on this exact field
    # (vibe.acp.acp_agent_loop:330: ``if not agent_loop.bypass_tool_permissions:``),
    # so setting it True skips every tool prompt — the closest
    # equivalent to other agents' --yolo / --dangerously-skip-permissions.
    # The older ``VIBE_AUTO_APPROVE=true`` was silently dropped (no such
    # field; ``extra="ignore"``) and matched only the agent-profile name.
    VIBE_BYPASS_TOOL_PERMISSIONS: "true"

session:
  supports_resume: true
  resume_flag: "--resume"
  continue_flag: "--continue"
  # Only hook-captured IDs: never reuse the old shared-directory discovery pointer.
  session_file: vibe-session-id.txt

capabilities:
  log_format: plain

# The Mistral endpoint Vibe routes to lives in resources/providers/mistral.yaml.
protocol: openai-chat
provider:
  default: mistral
  credential_type: api_key
  credential_file: .env
  token_env:
    _default: MISTRAL_API_KEY
  config_patch:
    file: config.toml
    toml_table: providers
    toml_match: {name: mistral}
    # Vibe replaces same-name provider entries rather than merging fields.
    # Keep the key binding for vault auth and the backend for native catalog
    # discovery, which skips generic providers even when named "mistral".
    toml_set:
      api_base: "{{ vault_url }}/v1"
      api_key_env_var: MISTRAL_API_KEY
      backend: mistral

auth:
  host_dir: _vibe-config
  container_mount: /home/dev/.vibe
  # Vibe's browser sign-in polls Mistral until the operator approves, so it
  # needs no forwarded port.  With no keyring in the container, Vibe saves the
  # key to .env, which the vibe credential extractor reads.
  modes: [login, api_key]
  command: ["vibe"]
  banner_hint: |-
    Vibe will start its setup: choose 'Launch browser', then 'Mistral AI'.
    No browser opens in the container: press c to show the sign-in URL and open it anywhere.
    After 'Finished setup', exit Vibe with /exit or Ctrl+C.
  api_key_hint: "Vibe plan key: https://chat.mistral.ai/code/extensions?focus=key (pay-as-you-go API key: https://console.mistral.ai/api-keys)"

install:
  run_as_root: |
    RUN set -eux; \
        cp /tmp/terok-scripts/terok-vibe-session.py /usr/local/share/terok/; \
        cp /tmp/terok-scripts/terok-vibe-acp /usr/local/bin/terok-vibe-acp; \
        cp /tmp/terok-scripts/terok-native-provider /usr/local/bin/terok-native-provider; \
        chmod +x /usr/local/bin/terok-vibe-acp \
                 /usr/local/bin/terok-native-provider; \
        ln -sf terok-native-provider /usr/local/bin/vibe-provider
  # Vibe's updater uses uv, so dev must own its tool environment. Seed a
  # GIL-enabled interpreter: uv cannot download a +gil request directly,
  # and Vibe's dependencies do not all ship free-threaded Python wheels.
  run_as_dev: |
    ENV VIBE_EXPERIMENTAL_ENABLE_MODEL_CATALOG=true
    RUN uv python install cpython-3.14 \
     && uv tool install --python cpython-3.14+gil mistral-vibe

help:
  label: '  \033[36mvibe\033[0m       - Mistral Vibe'
