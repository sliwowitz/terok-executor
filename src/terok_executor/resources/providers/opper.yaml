# Opper — an EU-hosted AI gateway fronting 700+ models from 50+ providers.
# It speaks the OpenAI, Anthropic, and Google AI wire formats from one base
# URL; usage is billed against Opper credits.  Drivable by any harness
# (opencode, pi).

upstream: https://api.opper.ai

auth:
  api_key:
    header: Authorization
    prefix: "Bearer "

# Opper serves every compatibility surface under /v3/compat: the OpenAI
# client appends /chat/completions to the base, while an Anthropic client
# appends the full /v1/messages itself — both resolve against the same base.
serves:
  openai-chat: "/v3/compat"
  anthropic-messages: "/v3/compat"

# Driven by the OpenCode harness — a one-word `opper` command (symlinked to
# the opencode-provider family) plus the OpenAI-compatible config the wrapper
# writes into opencode.json.  The endpoint above is the routed path; this
# base_url is the direct one the wrapper falls back to.
opencode:
  display_name: Opper
  base_url: https://api.opper.ai/v3/compat
  preferred_model: anthropic/claude-sonnet-4-6
  fallback_model: openai/gpt-5-mini
  env_var_prefix: OPPER
  config_dir: .opper
  auth_key_url: https://platform.opper.ai/settings/api-keys
  api_key_hint: |-
    Create an API key at:
      https://platform.opper.ai/settings/api-keys
    Opper is an EU-hosted gateway covering models from OpenAI, Anthropic,
    Google and others; usage is billed against your Opper credits.

install:
  depends_on: [opencode]
  run_as_root: |
    RUN set -eux; \
        ln -sf opencode-provider     /usr/local/bin/opper; \
        ln -sf opencode-provider-acp /usr/local/bin/opper-acp; \
        ln -sf opencode-toad         /usr/local/bin/oppertoad

help:
  label: '  \033[36mopper\033[0m      - OpenCode with Opper'
